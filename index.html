<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solana Token Delegator</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Solana Token Delegator</h1>
      <div id="wallet-section">
        <button id="connect-btn">Connect Wallet</button>
        <span id="wallet-addr"></span>
      </div>
    </header>

    <main id="main" class="hidden">
      <!-- Network selector -->
      <div class="field">
        <label for="network">Network</label>
        <select id="network">
          <option value="mainnet-beta">Mainnet</option>
          <option value="devnet">Devnet</option>
        </select>
      </div>

      <!-- Token accounts -->
      <div class="field">
        <label for="token-select">Token Account</label>
        <select id="token-select">
          <option value="">-- connect wallet first --</option>
        </select>
        <span id="token-info" class="sub"></span>
      </div>

      <!-- Delegate address -->
      <div class="field">
        <label for="delegate-addr">Delegate Address</label>
        <input id="delegate-addr" type="text" placeholder="Pubkey of the delegate" />
      </div>

      <!-- Amount -->
      <div class="field">
        <label for="amount">Amount to Approve</label>
        <input id="amount" type="number" placeholder="Max tokens delegate can spend" min="0" step="any" />
      </div>

      <!-- Actions -->
      <div class="actions">
        <button id="approve-btn" class="primary">Approve Delegate</button>
        <button id="revoke-btn" class="danger">Revoke Delegate</button>
      </div>

      <!-- Current delegation info for selected token -->
      <div id="delegation-info" class="info-box hidden">
        <h3>Current Delegation</h3>
        <p>Delegate: <span id="current-delegate">--</span></p>
        <p>Approved Amount: <span id="current-amount">--</span></p>
      </div>

      <!-- All active delegations (as owner) -->
      <div id="delegations-section" class="hidden">
        <h2 class="section-title">Active Delegations (as Owner)</h2>
        <p id="no-delegations" class="sub hidden">No active delegations found.</p>
        <div id="delegations-list"></div>
      </div>

      <!-- Transfer as Delegate -->
      <div id="delegate-transfer-section">
        <h2 class="section-title">Transfer as Delegate</h2>
        <p class="sub" style="margin-bottom:12px">Pull tokens from accounts that delegated to your connected wallet.</p>
        <div class="field">
          <label for="source-owner">Source Owner Address</label>
          <input id="source-owner" type="text" placeholder="Owner wallet that delegated to you" />
        </div>
        <div class="field">
          <label for="source-mint">Token Mint</label>
          <input id="source-mint" type="text" placeholder="Mint address of the token" />
        </div>
        <div class="field">
          <label for="transfer-amount">Amount to Transfer</label>
          <input id="transfer-amount" type="number" placeholder="Amount to pull" min="0" step="any" />
        </div>
        <div class="field">
          <label for="dest-addr">Destination Address</label>
          <input id="dest-addr" type="text" placeholder="Recipient wallet (defaults to your wallet)" />
        </div>
        <button id="lookup-btn" class="secondary" style="margin-bottom:8px">Lookup Delegations to Me</button>
        <div id="incoming-delegations"></div>
        <div class="actions" style="margin-top:12px">
          <button id="delegate-transfer-btn" class="primary">Transfer as Delegate</button>
        </div>
      </div>

      <!-- Status -->
      <div id="status" class="hidden"></div>
    </main>

    <footer>
      <p>Connect your Solana wallet to delegate SPL tokens.</p>
    </footer>

    <!-- Wallet picker modal -->
    <div id="wallet-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <h2>Connect Wallet</h2>
        <div id="wallet-list"></div>
        <button id="modal-close" class="modal-close-btn">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
